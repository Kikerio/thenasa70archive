<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA 70 - Logo Animation</title>
    <style>
        /* TEMA E SETTINGS AVANZATI */
        :root {
            --space-black: #000000;
            /* Curva Easy Ease ancora più estrema per massima fluidità */
            --ease-extreme: cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            margin: 0;
            background-color: var(--space-black);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .logo-container {
            position: relative;
            width: 800px;
            height: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* IL WRAPPER PRINCIPALE CON LA MASCHERA */
        .shield-wrapper {
            position: relative;
            width: 450px; 
            height: 450px;
            opacity: 0;
            transform: scale(0.85);
            animation: shieldEntrance 1.5s var(--ease-extreme) forwards;
            will-change: transform, opacity;
        }

        /* 1. SFONDO BLU (Base visibile) */
        .base-sfondo {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
        }

        /* IL CONTENITORE MASCHERATO */
        .masked-elements {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            /* La maschera usa lo scudo per nascondere ciò che sta fuori */
            -webkit-mask-image: url('assets/logo_parts/sfondo.png');
            -webkit-mask-size: contain;
            -webkit-mask-position: center;
            -webkit-mask-repeat: no-repeat;
            mask-image: url('assets/logo_parts/sfondo.png');
            mask-size: contain;
            mask-position: center;
            mask-repeat: no-repeat;
        }

        /* CLASSE BASE PER GLI ELEMENTI INTERNI */
        .element {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            opacity: 0;
            will-change: transform, opacity;
        }

        /* 2. RAZZO */
        .razzo {
            transform: translateY(100%);
            animation: slideUp 1.5s var(--ease-extreme) 0.4s forwards;
        }

        /* 3. LOGO NASA */
        .nasa {
            transform: translateY(15px);
            animation: fadeUp 1.2s var(--ease-extreme) 1.2s forwards;
        }

        /* 4. DATE (1958 - 2028) */
        .date {
            transform: translateY(15px);
            animation: fadeUp 1.2s var(--ease-extreme) 1.4s forwards;
        }

        /* 5. NUMERO 7 (Usiamo il file 70.png ma mostriamo solo il 50% di sinistra) */
        .sette {
            clip-path: polygon(0% 0%, 50% 0%, 50% 100%, 0% 100%);
            transform: translateX(-40%);
            animation: slideFromLeft 1.2s var(--ease-extreme) 1.8s forwards;
        }

        /* 6. NUMERO 0 (Usiamo lo stesso file 70.png ma mostriamo solo il 50% di destra) */
        .zero {
            clip-path: polygon(50% 0%, 100% 0%, 100% 100%, 50% 100%);
            transform: translateX(40%);
            animation: slideFromRight 1.2s var(--ease-extreme) 1.8s forwards;
        }


        /* --- KEYFRAMES --- */
        @keyframes shieldEntrance {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(100%); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideFromLeft {
            from { opacity: 0; transform: translateX(-40%); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideFromRight {
            from { opacity: 0; transform: translateX(40%); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <div class="shield-wrapper">
            
            <img src="assets/logo_parts/sfondo.png" class="base-sfondo" alt="Sfondo Blu">

            <div class="masked-elements">
                <img src="assets/logo_parts/razzo.png" class="element razzo" alt="Razzo">
                <img src="assets/logo_parts/nasa.png" class="element nasa" alt="Logo NASA">
                <img src="assets/logo_parts/date.png" class="element date" alt="Date">
                
                <img src="assets/logo_parts/70.png" class="element sette" alt="Numero 7">
                <img src="assets/logo_parts/70.png" class="element zero" alt="Numero 0">
            </div>

        </div>
    </div>

</body>
</html>
