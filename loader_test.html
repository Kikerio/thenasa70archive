<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA 70 - Preloader Pro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --background: #ffffff;
            --foreground: #000000;
            --nasa-red: #fc3d21;
            --nasa-blue: #0b3d91;
            --ease-extreme: cubic-bezier(0.16, 1, 0.3, 1);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #f0f0f0; 
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
        }

        /* --- IL PRELOADER --- */
        #preloader {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #ffffff;
            z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            /* Ridotto da 7s a 4s */
            animation: hidePreloaderBackground 1.5s var(--ease-extreme) 4s forwards;
        }

        /* --- CONTENITORE DEL LOGO --- */
        .logo-container-loader {
            position: relative; width: 500px; height: 500px;
            display: flex; justify-content: center; align-items: center;
            transform: translateY(-20px); 
            /* Ridotto da 7s a 4s */
            animation: shrinkAndMoveLogo 1.5s var(--ease-extreme) 4s forwards;
        }

        /* --- LOGO ANIMATION --- */
        .shield-wrapper {
            position: relative; width: 100%; height: 100%;
            opacity: 0; transform: scale(0.85);
            animation: shieldEntrance 1.5s var(--ease-extreme) forwards;
            will-change: transform, opacity;
        }
        .base-sfondo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        .masked-elements {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            -webkit-mask-image: url('assets/logo_parts/sfondo.png');
            -webkit-mask-size: contain; -webkit-mask-position: center; -webkit-mask-repeat: no-repeat;
            mask-image: url('assets/logo_parts/sfondo.png');
            mask-size: contain; mask-position: center; mask-repeat: no-repeat;
        }
        .element {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: contain; opacity: 0; will-change: transform, opacity;
        }
        .razzo { transform: translateY(100%); animation: slideUp 1.5s var(--ease-extreme) 0.4s forwards; }
        .nasa { transform: translateY(15px); animation: fadeUp 1.2s var(--ease-extreme) 1.2s forwards; }
        .date { transform: translateY(15px); animation: fadeUp 1.2s var(--ease-extreme) 1.4s forwards; }
        .sette { clip-path: polygon(0% 0%, 50% 0%, 50% 100%, 0% 100%); transform: translateX(-40%); animation: slideFromLeft 1.2s var(--ease-extreme) 1.8s forwards; }
        .zero { clip-path: polygon(50% 0%, 100% 0%, 100% 100%, 50% 100%); transform: translateX(40%); animation: slideFromRight 1.2s var(--ease-extreme) 1.8s forwards; }

        /* --- KEYFRAMES --- */
        @keyframes shieldEntrance { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideFromLeft { from { opacity: 0; transform: translateX(-40%); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideFromRight { from { opacity: 0; transform: translateX(40%); } to { opacity: 1; transform: translateX(0); } }
        
        @keyframes shrinkAndMoveLogo {
            0% { transform: scale(1) translateY(-20px); }
            100% { transform: scale(0.2) translateY(-45vh); opacity: 0; } 
        }
        @keyframes hidePreloaderBackground {
            0% { background-color: rgba(255, 255, 255, 1); }
            100% { background-color: rgba(255, 255, 255, 0); visibility: hidden; }
        }

        /* Testo provvisorio per farti vedere cosa succede dopo il loader */
        .fake-site-content {
            font-family: sans-serif; font-size: 2rem; color: #999; text-align: center; margin-top: 20%;
        }
    </style>
</head>
<body>

    <div class="fake-site-content">Il Loader scomparirà e vedrai questo.</div>

    <div id="preloader">
        <div class="logo-container-loader">
            <div class="shield-wrapper">
                <img src="assets/logo_parts/sfondo.png" class="base-sfondo" alt="Sfondo Blu">
                <div class="masked-elements">
                    <img src="assets/logo_parts/razzo.png" class="element razzo" alt="Razzo">
                    <img src="assets/logo_parts/nasa.png" class="element nasa" alt="Logo NASA">
                    <img src="assets/logo_parts/date.png" class="element date" alt="Date">
                    <img src="assets/logo_parts/70.png" class="element sette" alt="Numero 7">
                    <img src="assets/logo_parts/70.png" class="element zero" alt="Numero 0">
                </div>
            </div>
        </div>
    </div>

</body>
</html>
